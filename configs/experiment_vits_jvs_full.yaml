# VITSモデル実データ学習用設定（フル版）

# データ設定
data:
  dataset: "jvs"
  data_dir: "data/jvs_ljspeech"
  train_dir: "data/jvs_ljspeech"
  val_dir: "data/jvs_ljspeech"
  test_dir: "data/jvs_ljspeech"
  transcript_file: "metadata_multispeaker.csv"  # JVSフルデータセット用
  preprocessor: "openjtalk"
  max_duration: 10.0
  min_duration: 0.5
  
  # 音声設定
  sample_rate: 22050
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  
  # キャッシュ設定
  use_cache: true
  num_workers: 4  # CPUコア数に応じて調整

# モデル設定（VITS）
models:
  acoustic_model: "vits"
  vocoder: null
  
  xphonebert:
    enabled: false
    
  f0_bert:
    enabled: false
    
  # VITS設定（実データ用）
  vits:
    n_vocab: 93  # 日本語トークナイザーの語彙サイズ
    n_speakers: 100  # JVSデータセットは100スピーカー
    hidden_channels: 192
    filter_channels: 768
    n_heads: 2
    n_layers: 6
    kernel_size: 3
    p_dropout: 0.1
    n_flows: 4
    # 追加パラメータ
    speaker_embedding_dim: 256
    duration_predictor_filter_channels: 256
    duration_predictor_kernel_size: 3
    duration_predictor_dropout: 0.5

# 学習設定
training:
  num_epochs: 100  # 本番学習用
  batch_size: 32  # GPUメモリに応じて調整
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  mixed_precision: "fp16"  # GPUがサポートしている場合
  save_interval: 1000
  checkpoint_dir: "checkpoints/vits_jvs_full"
  resume_from: null
  
  # 損失重み
  loss_weights:
    total: 1.0
    
  # オプティマイザー設定
  optimizers:
    default:
      lr: 2e-4
      beta1: 0.8
      beta2: 0.99
      eps: 1e-9
      weight_decay: 0.0
      
  # スケジューラー設定
  schedulers:
    default:
      type: "exponential"
      gamma: 0.999875
      
  # ロギング設定
  logging:
    log_interval: 100
    trackers: "tensorboard"
    
  # メモリ最適化
  memory_optimization:
    gradient_checkpointing: false
    find_unused_parameters: false
    clear_cache_interval: 100
    empty_cache_on_validation: true

# パス設定
paths:
  checkpoints: "checkpoints/vits_jvs_full"
  tensorboard: "logs/vits_jvs_full/tensorboard"
  model_registry: "models/vits_jvs_full/registry.db"
  
# 評価設定
evaluation:
  metrics: ["mcd", "f0_rmse", "speaker_similarity"]
  save_samples: true
  num_samples: 10
  validation_interval: 1000