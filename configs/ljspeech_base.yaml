# LJSpeech形式のデータセット用基本設定

# データ設定
data:
  dataset: "ljspeech"
  data_dir: "data/ljspeech"  # コマンドラインで上書き
  
  # 音声設定（LJSpeechデフォルト）
  sample_rate: 22050
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  f_min: 0
  f_max: 8000
  
  # データローダー設定
  num_workers: 4
  use_cache: true
  cache_dir: "data/cache"
  
  # 音声長の制限（メモリ節約）
  max_audio_len: 220500  # 10秒 @ 22050Hz
  min_audio_len: 11025   # 0.5秒

# モデル設定
models:
  # 音響モデルの選択
  acoustic_model: "vits"  # "vits" or "matcha_tts"
  
  # XPhoneBERT設定
  xphonebert:
    enabled: false  # LJSpeechは英語なので無効化
    model_name: "vinai/xphonebert-base"
    hidden_size: 768
    num_layers: 12
    num_heads: 12
    
  # F0-BERT設定
  f0_bert:
    enabled: true
    hidden_size: 256
    num_layers: 6
    num_heads: 8
    pitch_bins: 256
    
  # VITS設定
  vits:
    n_vocab: 256
    n_speakers: 1  # LJSpeechはシングルスピーカー
    hidden_channels: 192
    inter_channels: 192
    filter_channels: 768
    n_heads: 2
    n_layers: 6
    kernel_size: 3
    p_dropout: 0.1
    resblock: "1"
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    
  # Matcha-TTS設定（代替）
  matcha:
    n_vocab: 256
    n_speakers: 1
    hidden_channels: 192
    filter_channels: 768
    n_heads: 2
    n_layers: 6
    n_flows: 4
    kernel_size: 5
    p_dropout: 0.1
    
  # BigVGAN設定
  bigvgan:
    num_mels: 80
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_rates: [8, 8, 2, 2]  # 256 hop @ 22050Hz
    upsample_kernel_sizes: [16, 16, 4, 4]
    use_snake_activation: true
    use_anti_aliasing: true

# 学習設定
training:
  num_epochs: 500
  batch_size: 32
  gradient_accumulation_steps: 1
  gradient_clip: 5.0
  mixed_precision: "fp16"
  
  # チェックポイント設定
  checkpoint_dir: "checkpoints/ljspeech"
  save_interval: 10
  keep_last_n: 5
  resume_from: null
  
  # 損失重み
  loss_weights:
    mel: 45.0
    kl: 1.0
    duration: 1.0
    pitch: 1.0
    
  # オプティマイザー設定
  optimizers:
    default:
      type: "adamw"
      lr: 2e-4
      beta1: 0.8
      beta2: 0.99
      eps: 1e-9
      weight_decay: 0.01
      
  # スケジューラー設定
  schedulers:
    default:
      type: "exponential"
      gamma: 0.999875
      
  # ロギング設定
  logging:
    log_interval: 100
    save_audio_interval: 1000
    trackers: ["tensorboard", "wandb"]
    wandb_project: "tsukuyomi-ljspeech"
    
  # 早期終了
  early_stopping:
    patience: 20
    min_delta: 0.0001
    mode: "min"
    
# 推論設定
inference:
  max_length: 600
  noise_scale: 0.667
  length_scale: 1.0
  noise_scale_w: 0.8
  
# 評価設定
evaluation:
  metrics:
    - "mel_cepstral_distortion"
    - "pitch_correlation"
    - "voice_quality"
  save_samples: true
  num_samples: 10
  
# パス設定
paths:
  checkpoints: "checkpoints/ljspeech"
  tensorboard: "logs/ljspeech/tensorboard"
  samples: "samples/ljspeech"