# VITSモデル実データ学習用設定（4GPU分散学習版）

# データ設定
data:
  dataset: "jvs"
  data_dir: "data/jvs_ljspeech"
  train_dir: "data/jvs_ljspeech"
  val_dir: "data/jvs_ljspeech"
  test_dir: "data/jvs_ljspeech"
  transcript_file: "metadata_multispeaker.csv"
  preprocessor: "openjtalk"
  max_duration: 10.0
  min_duration: 0.5
  
  # 音声設定
  sample_rate: 22050
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  
  # キャッシュ設定
  use_cache: true
  num_workers: 8  # 4GPU用に増加（各GPUに2ワーカー）

# モデル設定（フルモデル）
models:
  acoustic_model: "vits"
  vocoder: null
  
  xphonebert:
    enabled: false
    
  f0_bert:
    enabled: false
    
  # VITS設定（フルサイズ）
  vits:
    n_vocab: 93
    n_speakers: 100
    hidden_channels: 192
    filter_channels: 768
    n_heads: 2
    n_layers: 6
    kernel_size: 3
    p_dropout: 0.1
    n_flows: 4
    # 追加パラメータ
    speaker_embedding_dim: 256
    duration_predictor_filter_channels: 256
    duration_predictor_kernel_size: 3
    duration_predictor_dropout: 0.5

# 学習設定（4GPU最適化）
training:
  num_epochs: 100
  batch_size: 16  # GPU当たり16、総バッチサイズ64
  gradient_accumulation_steps: 1  # 分散学習では不要
  gradient_clip: 1.0
  mixed_precision: "fp16"
  save_interval: 500  # より頻繁に保存
  checkpoint_dir: "checkpoints/vits_jvs_4gpu"
  resume_from: null
  
  # 分散学習設定
  distributed:
    backend: "nccl"  # GPUにはNCCL推奨
    find_unused_parameters: false
    
  # 損失重み
  loss_weights:
    total: 1.0
    
  # オプティマイザー設定（分散学習用に調整）
  optimizers:
    default:
      lr: 8e-4  # 4GPU分なので4倍に（線形スケーリング）
      beta1: 0.8
      beta2: 0.99
      eps: 1e-9
      weight_decay: 0.0
      
  # スケジューラー設定
  schedulers:
    default:
      type: "exponential"
      gamma: 0.999875
      warmup_steps: 1000  # ウォームアップ追加
      
  # ロギング設定
  logging:
    log_interval: 50
    trackers: "tensorboard"
    log_grad_norm: true  # 勾配ノルムをログ
    
  # メモリ最適化
  memory_optimization:
    gradient_checkpointing: false  # 4GPUなら不要
    find_unused_parameters: false
    clear_cache_interval: 100
    empty_cache_on_validation: true
    
  # 同期設定
  sync_batchnorm: true  # BatchNormを同期

# パス設定
paths:
  checkpoints: "checkpoints/vits_jvs_4gpu"
  tensorboard: "logs/vits_jvs_4gpu/tensorboard"
  model_registry: "models/vits_jvs_4gpu/registry.db"
  
# 評価設定
evaluation:
  metrics: ["mcd", "f0_rmse", "speaker_similarity"]
  save_samples: true
  num_samples: 10
  validation_interval: 500
  
# 分散学習のモニタリング
monitoring:
  log_gpu_memory: true
  log_learning_rate: true
  log_gradient_norm: true
  profile_training: false  # 必要に応じて有効化