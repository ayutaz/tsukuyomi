# VITSモデルテスト用設定（トークナイザー統合）

# データ設定
data:
  dataset: "jvs"
  data_dir: "data/jvs_ljspeech"
  train_dir: "data/jvs_ljspeech"
  val_dir: "data/jvs_ljspeech"
  test_dir: "data/jvs_ljspeech"
  transcript_file: "metadata.csv"  # 開発環境用
  preprocessor: "openjtalk"
  max_duration: 10.0
  min_duration: 0.5
  
  # 音声設定
  sample_rate: 22050
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  
  # キャッシュ設定
  use_cache: false
  num_workers: 0  # マルチプロセスを無効化（pickleエラー回避）

# モデル設定（VITSを有効化）
models:
  acoustic_model: "vits"  # VITSモデルを使用
  vocoder: null  # VITSは内部でボコーダーを持つ
  
  xphonebert:
    enabled: false
    
  f0_bert:
    enabled: false
    
  # VITS設定（軽量版）
  vits:
    n_vocab: 93  # トークナイザーの語彙サイズに合わせる
    n_speakers: 100
    hidden_channels: 64    # 少し増やす
    filter_channels: 128   # 少し増やす
    n_heads: 2
    n_layers: 3
    kernel_size: 3
    p_dropout: 0.1
    n_flows: 4
    # 追加パラメータ
    speaker_embedding_dim: 32
    duration_predictor_filter_channels: 64
    duration_predictor_kernel_size: 3
    duration_predictor_dropout: 0.1

# 学習設定
training:
  num_epochs: 1
  batch_size: 2  # 開発環境用（ダミーデータが少ない）
  gradient_accumulation_steps: 2
  gradient_clip: 1.0
  mixed_precision: "no"  # まずは無効
  save_interval: 100
  checkpoint_dir: "checkpoints/vits_test"
  resume_from: null
  
  # 損失重み
  loss_weights:
    total: 1.0
    
  # オプティマイザー設定
  optimizers:
    default:
      lr: 1e-4
      beta1: 0.9
      beta2: 0.999
      eps: 1e-8
      weight_decay: 0.0
      
  # スケジューラー設定
  schedulers:
    default:
      type: "cosine_annealing_warm_restarts"
      T_0: 10
      T_mult: 2
      eta_min: 1e-6
      
  # ロギング設定
  logging:
    log_interval: 10
    trackers: "tensorboard"
    
  # メモリ最適化
  memory_optimization:
    gradient_checkpointing: false
    find_unused_parameters: false
    clear_cache_interval: 50
    empty_cache_on_validation: true

# パス設定
paths:
  checkpoints: "checkpoints/vits_test"
  tensorboard: "logs/vits_test/tensorboard"
  model_registry: "models/vits_test/registry.db"
  
# 評価設定
evaluation:
  metrics: []
  save_samples: false
  num_samples: 0