# VITSモデルのデバッグ用設定

# データ設定
data:
  dataset: "jvs"
  data_dir: "data/jvs_ljspeech"
  train_dir: "data/jvs_ljspeech"
  val_dir: "data/jvs_ljspeech"
  test_dir: "data/jvs_ljspeech"
  preprocessor: "openjtalk"
  max_duration: 5.0   # 短いサンプルのみ
  min_duration: 0.5
  
  # 音声設定
  sample_rate: 22050
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  
  # キャッシュ設定
  use_cache: false
  num_workers: 0

# モデル設定（VITS最小構成）
models:
  acoustic_model: "vits"
  vocoder: null  # ボコーダー無効
  
  xphonebert:
    enabled: false
    
  f0_bert:
    enabled: false
    
  # VITS設定（超最小構成）
  vits:
    n_vocab: 100      # 語彙数
    n_speakers: 10    # 話者数を減らす
    hidden_channels: 16    # 大幅に削減
    filter_channels: 32    # 大幅に削減
    n_heads: 1
    n_layers: 1
    kernel_size: 3
    p_dropout: 0.1
    n_flows: 1        # 最小フロー数
    # 追加の安定化パラメータ
    speaker_embedding_dim: 16
    duration_predictor_filter_channels: 16
    duration_predictor_kernel_size: 3
    duration_predictor_dropout: 0.1

# 学習設定
training:
  num_epochs: 1
  batch_size: 1  # 最小バッチサイズ
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  mixed_precision: "no"
  save_interval: 100
  checkpoint_dir: "checkpoints/debug_vits"
  
  loss_weights:
    total: 1.0
    
  optimizers:
    default:
      lr: 1e-4
      
  schedulers:
    default:
      type: "cosine_annealing"
      T_max: 1
      eta_min: 1e-6
      
  logging:
    log_interval: 1  # 毎ステップログ
    trackers: "tensorboard"
    
  memory_optimization:
    gradient_checkpointing: false
    find_unused_parameters: false
    clear_cache_interval: 10
    empty_cache_on_validation: true

# パス設定
paths:
  checkpoints: "checkpoints/debug_vits"
  tensorboard: "logs/debug_vits/tensorboard"
  model_registry: "models/debug_vits/registry.db"
  
# 評価設定
evaluation:
  metrics: []
  save_samples: false
  num_samples: 0