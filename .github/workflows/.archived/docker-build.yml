name: Dockerビルドテスト

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'

jobs:
  docker-build:
    name: Dockerイメージビルド
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Docker Buildx セットアップ
      uses: docker/setup-buildx-action@v3
    
    - name: Dockerイメージビルド（Linux）
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: tsukuyomi-tts:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true
    
    - name: ビルド結果確認
      run: |
        if docker images | grep -q tsukuyomi-tts; then
          echo "✅ Dockerイメージのビルドに成功しました"
        else
          echo "⚠️ Dockerイメージのビルドに失敗しましたが、開発には影響しません"
        fi