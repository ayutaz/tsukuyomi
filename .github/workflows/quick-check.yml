name: Quick Check

on:
  workflow_call:
  push:
    branches: [ dev, "feat/**", "fix/**" ]
  pull_request:
    branches: [ dev ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort mypy
          # Install minimal dependencies to resolve import errors
          pip install numpy torch transformers --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      
      - name: Check code formatting
        run: |
          echo "::group::Black"
          black --check --diff src tests
          echo "::endgroup::"
          
          echo "::group::isort"
          isort --check-only --diff src tests
          echo "::endgroup::"
      
      - name: Run ruff linter
        run: |
          ruff check src tests --output-format=github
      
      - name: Run type checker
        run: |
          mypy src --ignore-missing-imports --no-error-summary || true

  quick-test:
    name: Quick Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      
      - name: Run quick tests
        run: |
          python -m pytest tests/test_basic.py tests/test_utils.py -v --no-header -p no:warnings || echo "::warning::Some tests failed"
      
      - name: Check imports
        run: |
          python -c "import src; print('✓ Package imports successfully')"
          python -c "from src.models.vits import VITS; print('✓ VITS imports successfully')"
          python -c "from src.models.hifigan import HiFiGAN; print('✓ HiFiGAN imports successfully')"

  check-files:
    name: File Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for large files
        run: |
          echo "::group::Large files (>500KB)"
          find . -type f -size +500k ! -path "./.git/*" ! -path "./test_venv/*" ! -path "./.venv/*" -exec ls -lh {} \; | head -20
          echo "::endgroup::"
      
      - name: Check for TODOs and FIXMEs
        run: |
          echo "::group::TODOs"
          grep -rn "TODO" src/ --include="*.py" | head -20 || echo "No TODOs found"
          echo "::endgroup::"
          
          echo "::group::FIXMEs"
          grep -rn "FIXME" src/ --include="*.py" | head -20 || echo "No FIXMEs found"
          echo "::endgroup::"
      
      - name: Security quick scan
        run: |
          pip install bandit
          bandit -r src -f json -o bandit-quick.json --severity-level medium || true
          if [ -f bandit-quick.json ]; then
            echo "::warning::Security issues found. Check bandit-quick.json for details"
          fi