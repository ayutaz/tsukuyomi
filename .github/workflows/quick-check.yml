name: 高速品質チェック

on:
  workflow_call:
  push:
    branches: [ dev, "feat/**", "fix/**" ]
  pull_request:
    branches: [ dev ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-format:
    name: コード品質チェック（リント・フォーマット）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort mypy
          # Install minimal dependencies to resolve import errors
          pip install numpy
          # Explicitly install CPU-only versions
          pip install --no-cache-dir torch==2.2.0+cpu torchaudio==2.2.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install transformers librosa soundfile
          pip install -e .
      
      - name: Check code formatting
        run: |
          echo "::group::Black"
          black --check --diff src tests
          echo "::endgroup::"
          
          echo "::group::isort"
          isort --check-only --diff src tests
          echo "::endgroup::"
      
      - name: Run ruff linter
        run: |
          ruff check src tests --output-format=github
      
      - name: Run type checker
        run: |
          mypy src --ignore-missing-imports --no-error-summary || true

  quick-test:
    name: 基本動作テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install test dependencies
          pip install -r requirements-test.txt || true
          pip install -e ".[test]"
      
      - name: Run quick tests
        env:
          DISABLE_TORCHAUDIO: "true"
        run: |
          # Run most stable test first
          echo "::group::Basic Import Test"
          python -m pytest tests/test_basic.py::test_basic_assertion -v --no-header -p no:warnings || echo "::warning::Basic assertion test failed"
          echo "::endgroup::"
          
          # Run other basic tests
          echo "::group::Other Basic Tests"
          python -m pytest tests/test_basic.py -v --no-header -p no:warnings || echo "::warning::Some basic tests failed"
          echo "::endgroup::"
          
          # Run utils tests
          echo "::group::Utils Tests"
          python -m pytest tests/test_utils.py -v --no-header -p no:warnings || echo "::warning::Some utils tests failed"
          echo "::endgroup::"
      
      - name: Check imports
        run: |
          python -c "import src; print('✓ Package imports successfully')" || echo "⚠️ Package import failed"
          python -c "from src.models.vits import VITS; print('✓ VITS imports successfully')" || echo "⚠️ VITS import failed"
          python -c "from src.models.hifigan import HiFiGAN; print('✓ HiFiGAN imports successfully')" || echo "⚠️ HiFiGAN import failed"

  check-files:
    name: ファイル検証・セキュリティスキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for large files
        run: |
          echo "::group::Large files (>500KB)"
          find . -type f -size +500k ! -path "./.git/*" ! -path "./test_venv/*" ! -path "./.venv/*" -exec ls -lh {} \; | head -20
          echo "::endgroup::"
      
      - name: Check for TODOs and FIXMEs
        run: |
          echo "::group::TODOs"
          grep -rn "TODO" src/ --include="*.py" | head -20 || echo "No TODOs found"
          echo "::endgroup::"
          
          echo "::group::FIXMEs"
          grep -rn "FIXME" src/ --include="*.py" | head -20 || echo "No FIXMEs found"
          echo "::endgroup::"
      
      - name: Security quick scan
        run: |
          pip install bandit
          bandit -r src -f json -o bandit-quick.json --severity-level medium || true
          if [ -f bandit-quick.json ]; then
            echo "::warning::Security issues found. Check bandit-quick.json for details"
          fi