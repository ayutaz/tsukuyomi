name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-checks:
    name: Determine Required Checks
    runs-on: ubuntu-latest
    outputs:
      quick: ${{ steps.check.outputs.quick }}
      full: ${{ steps.check.outputs.full }}
    steps:
      - id: check
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          
          if [[ "${{ github.event_name }}" == "pull_request" ]] || \
             [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Running FULL checks"
            echo "full=true" >> $GITHUB_OUTPUT
            echo "quick=false" >> $GITHUB_OUTPUT
          else
            echo "Running QUICK checks"
            echo "full=false" >> $GITHUB_OUTPUT
            echo "quick=true" >> $GITHUB_OUTPUT
          fi
  
  quick-check:
    needs: determine-checks
    if: needs.determine-checks.outputs.quick == 'true'
    uses: ./.github/workflows/test-quick.yml
  
  full-ci:
    needs: determine-checks
    if: needs.determine-checks.outputs.full == 'true'
    uses: ./.github/workflows/test-full.yml
    secrets: inherit