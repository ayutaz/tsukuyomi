name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    name: Test Suite
    uses: ./.github/workflows/test-quick.yml
  
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.tests.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi