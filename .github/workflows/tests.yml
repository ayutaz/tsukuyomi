name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Exclude some combinations to save CI time
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      if: matrix.os != 'windows-latest'
    
    - name: Install uv (Windows)
      run: |
        irm https://astral.sh/uv/install.ps1 | iex
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
      if: matrix.os == 'windows-latest'
      shell: pwsh
    
    - name: Create virtual environment
      run: uv venv
    
    - name: Install dependencies
      run: |
        uv pip install -e .[test,dev]
        
    - name: Install MeCab (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
        
    - name: Install MeCab (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install mecab
        brew install mecab-ipadic
    
    - name: Run linting
      run: |
        uv run ruff check src tests
        uv run black --check src tests
        uv run isort --check-only src tests
    
    - name: Run type checking
      run: |
        uv run mypy src
      continue-on-error: true  # Type checking is informational
    
    - name: Run tests
      run: |
        uv run pytest -v --cov=src --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        env_vars: OS,PYTHON
        name: codecov-umbrella
        fail_ci_if_error: false

  gpu-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Note about GPU tests
      run: |
        echo "GPU tests would run here in a real environment with GPU access"
        echo "Skipping GPU tests in GitHub Actions (no GPU available)"

  integration-tests:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e .[test,dev]
        sudo apt-get update
        sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
    
    - name: Run integration tests
      run: |
        uv run pytest tests/test_integration.py -v -m "not slow"