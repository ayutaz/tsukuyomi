name: Dependencies

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependencies.yml'
      - 'scripts/test_installation.py'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependencies.yml'
      - 'scripts/test_installation.py'
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC

jobs:
  test-cpu-dependencies:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Create virtual environment
      run: |
        uv venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
        echo "$PWD/.venv/bin" >> $GITHUB_PATH
    
    - name: Test librosa compatibility fix
      run: |
        uv pip install "librosa>=0.10.1" "numba>=0.57.0"
        python -c "import librosa; print(f'librosa version: {librosa.__version__}')"
    
    - name: Install from requirements.txt
      run: |
        uv pip install -r requirements.txt
        # Install additional dependencies that might be missing
        uv pip install rotary-embedding-torch || echo "rotary-embedding-torch not available, skipping"
    
    - name: Install package
      run: |
        uv pip install -e .
    
    - name: Test imports
      run: |
        python -c "
        import torch
        import torchaudio
        import transformers
        import librosa
        import numpy
        import scipy
        import soundfile
        import omegaconf
        import hydra
        import accelerate
        import wandb
        import tensorboard
        import einops
        import pesq
        import pystoi
        import jiwer
        import seaborn
        import pyopenjtalk_plus
        print('All imports successful!')
        print(f'PyTorch version: {torch.__version__}')
        print(f'Python version: {torch.version.cuda}')
        "
    
    - name: Run basic tests
      run: |
        if [ -f scripts/test_installation.py ]; then
          python scripts/test_installation.py
        else
          echo "test_installation.py not found, running basic import test"
          python -c "
          import torch
          import librosa
          import numpy
          print('Basic imports successful!')
          "
        fi

