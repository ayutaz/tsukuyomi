name: Dependencies

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependencies.yml'
      - 'scripts/test_installation.py'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependencies.yml'
      - 'scripts/test_installation.py'
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC

jobs:
  test-cpu-dependencies:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Create virtual environment
      run: |
        uv venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
        echo "$PWD/.venv/bin" >> $GITHUB_PATH
    
    - name: Test librosa compatibility fix
      run: |
        uv pip install "librosa>=0.10.1" "numba>=0.57.0"
        python -c "import librosa; print(f'librosa version: {librosa.__version__}')"
    
    - name: Install from requirements.txt
      run: |
        uv pip install -r requirements.txt
        # Install additional dependencies that might be missing
        uv pip install rotary-embedding-torch || echo "rotary-embedding-torch not available, skipping"
    
    - name: Install package
      run: |
        uv pip install -e .
    
    - name: Test imports
      run: |
        python -c "
        import sys
        print(f'Python: {sys.version}')
        
        # Test imports one by one to identify failures
        failed_imports = []
        
        modules = [
            'torch', 'torchaudio', 'transformers', 'librosa', 
            'numpy', 'scipy', 'soundfile', 'omegaconf', 'hydra',
            'accelerate', 'wandb', 'tensorboard', 'einops',
            'pesq', 'pystoi', 'jiwer', 'seaborn', 'pyopenjtalk_plus'
        ]
        
        for module in modules:
            try:
                __import__(module)
                print(f'✅ {module}')
            except ImportError as e:
                print(f'❌ {module}: {e}')
                failed_imports.append(module)
        
        if failed_imports:
            print(f'\\nFailed imports: {failed_imports}')
            print('Continuing with partial success...')
        else:
            print('\\nAll imports successful!')
        
        # Check PyTorch
        try:
            import torch
            print(f'\\nPyTorch version: {torch.__version__}')
            print(f'CUDA available: {torch.cuda.is_available()}')
        except:
            pass
        "
    
    - name: Run basic tests
      run: |
        if [ -f scripts/test_installation.py ]; then
          python scripts/test_installation.py
        else
          echo "test_installation.py not found, running basic import test"
          python -c "
          import torch
          import librosa
          import numpy
          print('Basic imports successful!')
          "
        fi

