[project]
name = "tsukuyomi"
version = "0.1.0"
description = "State-of-the-art Japanese Text-to-Speech system with multilingual support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tsukuyomi Development Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies
    "torch>=2.2.0",
    "torchaudio>=2.2.0", 
    "transformers>=4.38.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    
    # Audio processing
    "soundfile>=0.12.0",
    "librosa>=0.10.1",
    "matplotlib>=3.5.0",
    
    # TTS specific
    # "text2phonemesequence",  # Not available on PyPI
    # "bigvgan",  # Not available on PyPI
    
    # Japanese text processing
    "mecab-python3>=1.0.5; sys_platform != 'win32'",
    "unidic-lite>=1.0.8",
    "jaconv>=0.3.0",
    "pykakasi>=2.2.1",
    "pyopenjtalk-plus>=0.3.3",  # Improved version of pyopenjtalk
    
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "bandit[toml]>=1.7.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
]

gpu = [
    "nvidia-ml-py>=12.535.0",
    "GPUtil>=1.4.0",
    "psutil>=5.9.0",
]
h100 = [
    "nvidia-ml-py>=12.535.0",
    "transformer-engine>=1.2.0",
    "flash-attn>=2.5.0",
    "bitsandbytes>=0.42.0",
]
onnx = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxsim>=0.4.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "seaborn>=0.12.0",
]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "gradio>=4.0.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=0.8.0",
]
evaluation = [
    "pesq>=0.0.4",
    "pystoi>=0.3.3",
    "jiwer>=3.0.0",
    "crepe>=0.0.15",
    "whisper>=1.0.0",
]

[project.scripts]
tsukuyomi = "src.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/tsukuyomi"
Documentation = "https://tsukuyomi.readthedocs.io"
Repository = "https://github.com/yourusername/tsukuyomi"
Issues = "https://github.com/yourusername/tsukuyomi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "ipython>=8.17.0",
    "jupyterlab>=4.0.0",
    "bandit[toml]>=1.7.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
]


[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "test_venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "TRY",    # tryceratops
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0915", # too many statements
    "W293",    # blank line contains whitespace
    "PLC0415", # import should be at top-level (needed for lazy imports)
    "UP006",   # use dict instead of Dict
    "UP007",   # use X | Y
    "UP035",   # typing.Dict is deprecated
    "UP015",   # unnecessary mode argument
    "PTH123",  # open() should be replaced by Path.open()
    "TRY003",  # avoid specifying long messages outside exception class
    "PLW2901", # for loop variable overwritten
    "N812",    # lowercase imported as non-lowercase
    "RUF002",  # ambiguous unicode character
    "RUF003",  # ambiguous unicode character in comment
    "EXE001",  # shebang is present but file is not executable
    "PIE810",  # call startswith once with tuple
    "RET505",  # unnecessary elif after return
    "ERA001",  # found commented-out code
    "C414",    # unnecessary list() call within sorted()
    "C401",    # unnecessary generator
    "RUF001",  # ambiguous unicode character (needed for Japanese)
    "F541",    # f-string without placeholders (fixed)
    "SIM108",  # use ternary operator
    "TRY300",  # consider moving statement to else block
    "TRY400",  # use logging.exception
    "ARG002",  # unused method argument
    "SIM115",  # use context manager for opening files
    "SIM210",  # remove unnecessary True if else False
    "RUF022",  # __all__ is not sorted
    "PLR0402", # use from X import Y
    "F841",    # local variable assigned but never used
    "RET504",  # unnecessary assignment before return
    "PD901",   # avoid generic variable name df
    "B006",    # do not use mutable data structures for argument defaults
    "E722",    # do not use bare except
    "PLR5501", # use elif instead of else then if
    "F823",    # local variable referenced before assignment
    "F401",    # imported but unused
    "F821",    # undefined name (false positives)
    "B028",    # no explicit stacklevel
    "B905",    # zip without strict parameter
    "PTH110",  # os.path.exists -> Path.exists
    "PTH103",  # os.makedirs -> Path.mkdir
    "PTH118",  # os.path.join -> Path with /
    "TID252",  # prefer absolute imports
    "PLR0912", # too many branches
    "ARG001",  # unused function argument
    "B033",    # duplicate set items
    "RUF005",  # consider unpacking
    "B007",    # loop control variable not used
    "B008",    # function call in argument defaults
    "SIM105",  # use contextlib.suppress
    "E402",    # module level import not at top
    "ARG003",  # unused class method argument
    "N801",    # class name should use CapWords
    "N803",    # argument name should be lowercase
    "N806",    # variable in function should be lowercase
    "UP038",   # use X | Y in isinstance
    "PLE1142", # await should be used within async function
    "UP028",   # replace yield over for loop
    "PIE790",  # unnecessary pass statement
    "E741",    # ambiguous variable name
    "PLR1704", # redefining argument with local name
    "SIM102",  # use single if statement
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG"]  # Allow assert and magic values in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_expr = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = [".venv", "venv", "build", "dist"]
known_first_party = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "benchmark: marks benchmark tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "docs"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection tests