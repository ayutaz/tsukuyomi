[project]
name = "tsukuyomi"
version = "0.1.0"
description = "State-of-the-art Japanese Text-to-Speech system with multilingual support"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Tsukuyomi Development Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core dependencies
    "torch>=2.2.0",
    "torchaudio>=2.2.0", 
    "transformers>=4.38.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    
    # Audio processing
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "matplotlib>=3.5.0",
    
    # TTS specific
    # "text2phonemesequence",  # Not available on PyPI
    # "bigvgan",  # Not available on PyPI
    
    # Japanese text processing
    "mecab-python3>=1.0.5; sys_platform != 'win32'",
    "unidic-lite>=1.0.8",
    "jaconv>=0.3.0",
    "pykakasi>=2.2.1",
    
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
]
h100 = [
    "nvidia-ml-py>=12.535.0",
    "transformer-engine>=1.2.0",
    "flash-attn>=2.5.0",
    "bitsandbytes>=0.42.0",
]
onnx = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.88.0",
]

[project.scripts]
tsukuyomi = "src.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/tsukuyomi"
Documentation = "https://tsukuyomi.readthedocs.io"
Repository = "https://github.com/yourusername/tsukuyomi"
Issues = "https://github.com/yourusername/tsukuyomi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "ipython>=8.17.0",
    "jupyterlab>=4.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "-p no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "W"]
ignore = ["E501", "W503"]
line-length = 88
target-version = "py38"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = [".venv", "venv", "build", "dist"]
known_first_party = ["src"]